services:

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    image: alonaarz/tiktok_clone_front:${IMAGE_TAG:-latest}
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tiktok_network
    restart: unless-stopped


  # ============================================================
  # POSTGRES
  # ============================================================

  db:
    image: postgres:17
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: tiktok_clone
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - tiktok_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiktok_clone"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  # ============================================================
  # API
  # ============================================================

  api:
    image: alonaarz/tiktok_clone_back:${IMAGE_TAG:-latest}
    container_name: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=tiktok_clone;Username=postgres;Password=mypassword"

      RabbitMQ__HostName: "rabbitMQ"
      RabbitMQ__UserName: tiktok_app
      RabbitMQ__Password: tiktok_app_local_pass

      Jwt__Key: ${JWT_KEY}

      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}

      SMTP__Password: ${SMTP_PASSWORD}

      Redis__ConnectionString: "redis:6379,password=localredispass"

      LocalStorage__RootPath: "/app/local-storage"

      LocalStorage__BaseUrl: "http://${CURRENT_IP}:8080"

    ports:
      - "8080:8080"

    volumes:
      - api_uploads:/app/local-storage

    networks:
      - tiktok_network

    depends_on:
      db:
        condition: service_healthy

      rabbitMQ:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped


  # ============================================================
  # VIDEO PROCESSOR
  # ============================================================

  video_processor:
    image: alonaarz/tiktok_clone_video_processor:${IMAGE_TAG:-latest}
    container_name: video_processor

    environment:
      DOTNET_ENVIRONMENT: Development

      RabbitMQ__HostName: "rabbitMQ"
      RabbitMQ__UserName: tiktok_app
      RabbitMQ__Password: tiktok_app_local_pass

      LocalStorage__RootPath: "/app/local-storage"
      LocalStorage__BaseUrl: "http://${CURRENT_IP}:8080"

    networks:
      - tiktok_network

    volumes:
      - api_uploads:/app/local-storage

    depends_on:
      db:
        condition: service_healthy

      rabbitMQ:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # RABBITMQ
  # ============================================================

  rabbitMQ:
    image: rabbitmq:3-management
    container_name: rabbitMQ

    environment:
      # A non-"guest" user is required: RabbitMQ's default guest account
      # is only allowed to authenticate from localhost, but api/video_processor
      # connect to this container over the docker network (hostname "rabbitMQ"),
      # which is not localhost from RabbitMQ's point of view.
      RABBITMQ_DEFAULT_USER: tiktok_app
      RABBITMQ_DEFAULT_PASS: tiktok_app_local_pass

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - tiktok_network

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "check_port_connectivity"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:latest
    container_name: redis

    command:
      - redis-server
      - --requirepass
      - localredispass

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "localredispass",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    networks:
      - tiktok_network

    restart: unless-stopped


# ============================================================
# NETWORK
# ============================================================

networks:
  tiktok_network:
    name: tiktok_network_local


# ============================================================
# VOLUMES
# ============================================================

volumes:

  db:
    driver: local
    name: db_local

  api_uploads:
    driver: local
    name: api_uploads_local

  rabbitmq_data:
    driver: local
    name: rabbitmq_data_local

  redis_data:
    driver: local
    name: redis_data_local
